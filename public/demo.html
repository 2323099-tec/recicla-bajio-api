<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Prueba de Integración - Recicla Bajío</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }

        section {
            border: 1px solid #ccc;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-radius: 8px;
        }

        .tarjeta-residuo {
            border-bottom: 1px solid #eee;
            padding: 0.75rem 0;
        }

        .rb-aviso {
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 4px;
            background: #eef;
        }

        .rb-aviso--error {
            background: #fee;
            color: #900;
        }

        .rb-aviso--exito {
            background: #efe;
            color: #060;
        }

        .rb-error-campo {
            color: #c00;
            font-size: 0.85rem;
            margin: 0.25rem 0 0;
        }

        [data-campo] {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <h1>Prueba de Integración Front End + Laravel API</h1>

    <!-- MÓDULO 2: CATÁLOGO DE RESIDUOS -->
    <section id="catalogo">
        <h2>Catálogo de Residuos</h2>
        <div id="catalogo-aviso"></div>
        <form>
            <input type="search" id="buscador-residuos" placeholder="Buscar residuo...">
            <button type="button" id="limpiar-filtros">Limpiar</button>
        </form>
        <div id="filtro-categorias" style="margin: 1rem 0;"></div>
        <p id="catalogo-contador"></p>
        <div id="catalogo-resultados"></div>
    </section>

    <!-- MÓDULO 4: ENCUESTA DE HÁBITOS -->
    <section id="encuesta">
        <h2>Encuesta de Reciclaje</h2>
        <div id="encuesta-avisos"></div>
        <form id="form-encuesta" novalidate>
            <div data-campo="colonia_zona">
                <label>Colonia o zona: <input type="text" name="colonia_zona"></label>
            </div>
            <div data-campo="separa_residuos">
                <label>¿Separas residuos?
                    <select name="separa_residuos">
                        <option value="">Elige...</option>
                        <option value="Siempre">Siempre</option>
                        <option value="A veces">A veces</option>
                        <option value="Nunca">Nunca</option>
                    </select>
                </label>
            </div>
            <div data-campo="reutiliza">
                <label>¿Reutilizas envases?
                    <select name="reutiliza">
                        <option value="">Elige...</option>
                        <option value="Siempre">Siempre</option>
                        <option value="A veces">A veces</option>
                        <option value="Nunca">Nunca</option>
                    </select>
                </label>
            </div>
            <div data-campo="conoce_acopios">
                <label>¿Conoces centros de acopio?
                    <select name="conoce_acopios">
                        <option value="">Elige...</option>
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                </label>
            </div>
            <div data-campo="frecuencia_entrega">
                <label>¿Cada cuánto entregas residuos?
                    <select name="frecuencia_entrega">
                        <option value="">Elige...</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Quincenal">Quincenal</option>
                        <option value="Mensual">Mensual</option>
                        <option value="Nunca">Nunca</option>
                    </select>
                </label>
            </div>
            <div data-campo="materiales">
                <p><strong>Materiales que separas:</strong></p>
                <div id="encuesta-materiales"></div>
            </div>
            <div data-campo="consentimiento">
                <label><input type="checkbox" name="consentimiento" value="si"> Acepto participar en esta
                    encuesta</label>
            </div>
            <button type="submit">Enviar encuesta</button>
        </form>
        <div id="encuesta-resumen" hidden></div>
    </section>

    <!-- MÓDULO 7: CONTACTO -->
    <section id="contacto">
        <h2>Contacto</h2>
        <div id="contacto-avisos"></div>
        <form id="form-contacto" novalidate>
            <input type="text" name="sitio_web" style="display:none" tabindex="-1" autocomplete="off">
            <div data-campo="nombre">
                <label>Nombre (opcional): <input type="text" name="nombre"></label>
            </div>
            <div data-campo="correo">
                <label>Correo: <input type="email" name="correo"></label>
            </div>
            <div data-campo="tipo_mensaje">
                <label>Tipo:
                    <select name="tipo_mensaje">
                        <option value="comentario">Comentario</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="error_datos">Error en datos</option>
                        <option value="otro">Otro</option>
                    </select>
                </label>
            </div>
            <div data-campo="mensaje">
                <label>Mensaje: <textarea name="mensaje"></textarea></label>
                <small id="contador-mensaje"></small>
            </div>
            <button type="submit">Enviar mensaje</button>
        </form>
    </section>

    <!-- Carga de scripts en orden estricto de dependencias -->
    <script src="js/datos/residuosLocales.js"></script>
    <script src="js/utils/herramientas.js"></script>
    <script src="js/utils/Avisos.js"></script>
    <script src="js/utils/Validador.js"></script>
    <script src="js/utils/http.js"></script>
    <script src="js/modelos/ResiduoModelo.js"></script>
    <script src="js/modelos/EncuestaModelo.js"></script>
    <script src="js/vistas/CatalogoVista.js"></script>
    <script src="js/vistas/EncuestaVista.js"></script>
    <script src="js/controladores/CatalogoControlador.js"></script>
    <script src="js/controladores/EncuestaControlador.js"></script>
    <script src="js/controladores/ContactoControlador.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
